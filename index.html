            { num: 64, q: "الديانة التي كانت منتشرة في شبة الجزيرة العربية قبل الإسلام:", options: ["الوثنية", "المجوسية", "البوذية", "الهندوسية"], correct: 0 },

            { num: 66, q: "التمييز بين السرايا والغزوة يستخدم المعلم أسلوب:", options: ["المقارنة", "المحاضرة", "الحوار", "الاستقصاء"], correct: 0 },

            { num: 69, q: "الترتيب الزمني في الأحداث التاريخية:", options: ["يوم- شهر - عقد - قرن - جيل", "قرن - عقد - جيل - شهر - يوم", "جيل - قرن - عقد - شهر - يوم", "شهر - يوم - جيل - قرن - عقد"], correct: 0 },
            { num: 70, q: "يصعب فهم التزامن والتقارب للطلاب ولكي يسهل المعلم على طلابه مفهوم التزامن والتقارب فأي الامثلة التالية يسهل على الطلاب فهم التزامن والتقارب ؟", options: ["الدول المنفصلة في الشام والمغرب العربي", "تاريخ الأنبياء القدامى", "الحروب الصليبية", "العصر الجاهلي"], correct: 0 },
            { num: 71, q: "أهمية تدريس الدراسات الإجتماعيه للمرحلة الابتدائية:", options: ["المواطنة المسئولة", "التخصص الأكاديمي الدقيق", "البحث الميداني التاريخي", "جمع الآثار"], correct: 0 },
            { num: 72, q: "أفضل طريقة يستخدمها المعلم لكي يوضح لطلابه توسع الفتوحات الاسلامية هي:", options: ["الخريطة التاريخية", "الخط الزمني", "الجدول المقارن", "القصة التاريخية"], correct: 0 },
            { num: 73, q: "أفضل وسيلة لربط البعد الزماني والمكاني:", options: ["الخريطة التاريخية", "السبورة الذكية", "الكتاب المدرسي", "المجسمات"], correct: 0 },
            { num: 74, q: "ماذا سيكون حال أوروبا - لو تمكن المسلمون من الإنتصار في معركه بلاط الشهداء - سؤال يمكن للمعلم طرحه لتنميه مهارات الطلاب في:", options: ["بناء تصورات مختلفة للنتائج في ضوء متغيرات مقترحة", "الحفظ والتذكر", "الاستنباط المباشر", "التحليل الإحصائي"], correct: 0 },
            { num: 75, q: "عملية توليد الأفكار تسمي:", options: ["عصف ذهني", "تلقين", "استرجاع", "ملاحظة"], correct: 0 },
            { num: 76, q: "يستخدم المعلم في شرح أحداث متتالية مهارة:", options: ["الخط الزمني", "الخريطة المفاهيمية", "جدول البيانات", "المحاضرة"], correct: 0 },
            { num: 77, q: "من أشد أعداء إمارة الدرعية والدولة السعودية الأولى:", options: ["دهام بن دواس", "ععر بن عفيصان", "مشاري بن سعود", "تركي بن عبد الله"], correct: 0 }
        ];

        function balanceQuizOptions(dataset) {
            return dataset.map((item, index) => {
                const correctText = item.options[item.correct];
                const wrongOptions = item.options.filter((_, i) => i !== item.correct);
                const shuffledWrongs = [...wrongOptions].sort(() => 0.5 - Math.random());
                const targetIndex = index % 4;
                
                const finalOptions = [];
                let wrongPtr = 0;
                for (let pos = 0; pos < 4; pos++) {
                    if (pos === targetIndex) {
                        finalOptions.push(correctText);
                    } else {
                        finalOptions.push(shuffledWrongs[wrongPtr++]);
                    }
                }
                
                return {
                    num: item.num,
                    q: item.q,
                    options: finalOptions,
                    correct: targetIndex
                };
            });
        }

        var cardsData = balanceQuizOptions(rawCardsData);
        cardsData.push({
            isConclusion: true,
            title: "تمنياتي لكم بالتوفيق والنجاح",
            subTitle: "لا أحلل نشرها ورقياً أو الكترونيا الورد"
        });

        var letters = ["أ", "ب", "ج", "د"];
        var currentIndex = 0;
        var score = 0;
        var answersState = {};
        var optionsRevealedState = {};

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const wrapper = document.getElementById('quiz-app-wrapper');
            canvas.width = wrapper.offsetWidth;
            canvas.height = wrapper.offsetHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', resizeCanvas);

        function render() {
            if (cardsData.length === 0) return;
            if (currentIndex >= cardsData.length) currentIndex = cardsData.length - 1;

            var item = cardsData[currentIndex];
            var totalQCount = cardsData.filter(c => !c.isConclusion).length;

            document.getElementById("progress-bar").style.width = ((currentIndex + 1) / cardsData.length * 100) + "%";
            document.getElementById("btn-prev").disabled = (currentIndex === 0);
            document.getElementById("btn-next-top").disabled = (currentIndex === cardsData.length - 1);

            var qBoxContainer = document.getElementById("q-box-container");
            var revealBox = document.getElementById("revealBox");
            var optionsContainer = document.getElementById("options-container");
            var conclusionContainer = document.getElementById("conclusion-container");

            if (item.isConclusion) {
                document.getElementById("question-count").innerText = "الشريحة الختامية";
                document.getElementById("score-count").innerText = `النقاط النهائية: ${score} من ${totalQCount}`;
                
                qBoxContainer.style.display = "none";
                revealBox.style.display = "none";
                optionsContainer.style.display = "none";
                conclusionContainer.style.display = "block";

                conclusionContainer.innerHTML = `
                    <div class="conclusion-card-box">
                        <div style="font-size: 50px; margin-bottom: 10px;">🌟🎓🌟</div>
                        <div class="conclusion-main-title">${item.title}</div>
                        <div class="conclusion-sub-tag">${item.subTitle}</div>
                    </div>
                `;
            } else {
                document.getElementById("question-count").innerText = `السؤال ${currentIndex + 1} من ${totalQCount}`;
                document.getElementById("score-count").innerText = `النقاط: ${score}`;

                qBoxContainer.style.display = "block";
                conclusionContainer.style.display = "none";

                var qNumber = item.num !== undefined ? item.num : (currentIndex + 1);
                document.getElementById("q-badge").innerText = `سؤال ${qNumber}`;
                document.getElementById("q-text").innerText = item.q;

                var isRevealed = optionsRevealedState[currentIndex] || answersState.hasOwnProperty(currentIndex);

                if (!isRevealed) {
                    revealBox.style.display = "flex";
                    optionsContainer.style.display = "none";
                    optionsContainer.innerHTML = "";
                } else {
                    revealBox.style.display = "none";
                    optionsContainer.style.display = "grid";
                    renderOptionsExplicitly(currentIndex, optionsContainer, false);
                }
            }
            resizeCanvas();
        }

        function renderOptionsExplicitly(qIdx, container, forceShowCorrect) {
            container.innerHTML = "";
            var item = cardsData[qIdx];
            var hasAnswered = answersState.hasOwnProperty(qIdx) || forceShowCorrect;
            var chosenAns = answersState[qIdx];

            for (var idx = 0; idx < item.options.length; idx++) {
                (function(i) {
                    var btn = document.createElement("button");
                    var isCorrect = (i === item.correct);
                    var isWrong = (hasAnswered && !forceShowCorrect && i === chosenAns && !isCorrect);

                    var bg = "#f8fafc";
                    var border = "#cbd5e1";
                    var textColor = "#1e293b";
                    var letterBg = "#e2e8f0";
                    var letterColor = "#0f2c59";

                    if (hasAnswered && isCorrect) {
                        bg = "#ecfdf5";
                        border = "#10b981";
                        textColor = "#064e3b";
                        letterBg = "#10b981";
                        letterColor = "#ffffff";
                    } else if (isWrong) {
                        bg = "#fef2f2";
                        border = "#ef4444";
                        textColor = "#7f1d1d";
                        letterBg = "#ef4444";
                        letterColor = "#ffffff";
                    }

                    btn.style.cssText = `background-color: ${bg} !important; border: 2.5px solid ${border} !important; border-radius: 14px; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: right; min-height: 64px; opacity: 1 !important; visibility: visible !important;`;

                    var checkHtml = (hasAnswered && isCorrect) ? '<span style="font-size: 20px; font-weight: 900; color: #10b981; margin-right: auto; margin-left: 8px; background: #d1fae5; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid #10b981; opacity: 1 !important;">✔</span>' : "";

                    btn.innerHTML = `
                        <span style="width: 38px; height: 38px; background-color: ${letterBg} !important; color: ${letterColor} !important; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; flex-shrink: 0; opacity: 1 !important; visibility: visible !important;">${letters[i]}</span>
                        <span style="font-size: 18px; font-weight: 800; color: ${textColor} !important; flex-grow: 1; padding: 0 14px; opacity: 1 !important; visibility: visible !important;">${item.options[i]}</span>
                        ${checkHtml}
                    `;

                    if (!hasAnswered) {
                        btn.onclick = function() { selectOption(i); };
                    }
                    container.appendChild(btn);
                })(idx);
            }
        }

        function revealOptionsOnly() {
            optionsRevealedState[currentIndex] = true;
            render();
        }

        function revealAndShowAnswer() {
            optionsRevealedState[currentIndex] = true;
            var item = cardsData[currentIndex];
            if (!answersState.hasOwnProperty(currentIndex)) {
                answersState[currentIndex] = item.correct;
                score++;
            }
            render();
        }

        function selectOption(selectedIndex) {
            if (answersState.hasOwnProperty(currentIndex)) return;
            answersState[currentIndex] = selectedIndex;
            var item = cardsData[currentIndex];

            if (selectedIndex === item.correct) {
                score++;
                document.getElementById("score-count").innerText = "النقاط: " + score;
            }
            render();
        }

        function nextQuestion() {
            if (currentIndex < cardsData.length - 1) {
                currentIndex++;
                render();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                render();
            }
        }

        render();
    </script>
